<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <div class="card col-md-6 mx-auto border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h4>Confirm Deletion</h4>
        </div>
        <div class="card-body">
            <p class="lead">Are you sure you want to delete this user?</p>
            
            <h3 class="my-3">{{ user.first_name }} {{ user.last_name }}</h3>
            <p class="text-muted">{{ user.email }}</p>

            <div class="alert alert-warning">
                <strong>Warning:</strong> This cannot be undone.
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mt-4">
                    <a href="{% url 'user_list' %}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
